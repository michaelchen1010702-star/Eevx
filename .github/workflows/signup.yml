name: eevx-signup
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Your email'
        required: true
      password:
        description: 'Password (8+ chars)'
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node signup.mjs
        env:
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
